[package]
name = "steam-punk"
version = "0.4.9"
edition = "2021"
description = "Launch Windows game trainers through Proton against a running Steam game's wine session"
authors = ["Linnard Alex Brown Jr."]
license = "AGPL-3.0-or-later"

[[bin]]
name = "steam-punk"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_4", "v1_5"] }
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
anyhow = "1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
