[package]
name = "steam-punk"
version = "0.8.0"
edition = "2021"
rust-version = "1.100"
description = "Launch Windows game trainers through Proton against a running Steam game's wine session"
authors = ["Linnard Alex Brown Jr."]
license = "AGPL-3.0-or-later"

[[bin]]
name = "steam-punk"
path = "src/main.rs"

[dependencies]
# The UI toolkit: GPUI Kit (GPUI + gpui-base + gpui-component + default icons).
gpui-kit = "=0.9.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
anyhow = "1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
log = "0.4"

[lints.cargo]
unused_dependencies = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
